name: Bug report
description: The action failed, or produced an IPA that will not install
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please attach the **full log** of the failing step. Most failures here are
        `xcodebuild` errors whose useful part is far above the last visible line.
  - type: textarea
    id: inputs
    attributes:
      label: The `with:` block you used
      description: Exactly as written in your workflow file.
      render: yaml
    validations:
      required: true
  - type: dropdown
    id: project-type
    attributes:
      label: Project type
      options:
        - ".xcodeproj"
        - ".xcworkspace (CocoaPods / SPM workspace)"
    validations:
      required: true
  - type: input
    id: runner
    attributes:
      label: Runner image and Xcode version
      description: "For example: macos-15, Xcode 16.4"
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Failing log output
      description: Paste the tail of the failing step, including any `** BUILD FAILED **` block.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: false
